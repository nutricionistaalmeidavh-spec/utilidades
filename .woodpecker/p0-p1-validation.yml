labels:
  platform: windows/amd64
  backend: local

when:
  - event: [push, pull_request, manual]

steps:
  - name: validar-p0-p1
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Continue"'
      - 'New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null'
      - '$utf8 = [Text.UTF8Encoding]::new($false)'
      - '$fallback = ''{"product":"utilidades-rag-quality","version":"p0-p1","profile":"quick","status":"blocked","failedStep":"bootstrap","metadata":{"purpose":"P0/P1 reusable modules validation"},"steps":[{"id":"bootstrap","status":"fail","command":"woodpecker direct artisys-release bootstrap","exitCode":1,"reason":"artisys-release ainda nao concluiu","stdout":"","stderr":"artisys-release ainda nao concluiu"}]}'''
      - '[IO.File]::WriteAllText(".\artifacts\artisys-release-report.json", $fallback + "`n", $utf8)'
      - '[IO.File]::WriteAllText(".\artifacts\woodpecker-release.log", "=== RepoUteis P0/P1 ===`r`n", $utf8)'
      - 'node --version'
      - 'node .\modules\artisys-release\bin\artisys-release.mjs .\.artisys\p0-p1-validation.json --profile quick --report .\artifacts\artisys-release-report.json'

  - name: verificar-relatorio
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '$reportPath = ".\artifacts\artisys-release-report.json"'
      - 'if (-not (Test-Path $reportPath)) { throw "Relatorio P0/P1 nao foi gerado." }'
      - '$report = Get-Content $reportPath -Raw | ConvertFrom-Json'
      - 'if ($report.status -ne "pass") { throw "P0/P1 terminou com status $($report.status), step $($report.failedStep)." }'
      - 'Write-Host "[RepoUteis Woodpecker] P0/P1 aprovado: $reportPath"'

  - name: reportar-falha-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [failure]
    failure: ignore

  - name: reportar-sucesso-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
      ARTISYS_CI_RESULT: 'success'
      ARTISYS_COMMENT_SUCCESS: 'false'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [success]
    failure: ignore
