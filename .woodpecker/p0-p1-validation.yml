labels:
  platform: windows/amd64
  backend: local

when:
  - event: [push, pull_request, manual]

steps:
  - name: ambiente
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
    commands:
      - '$ErrorActionPreference = "Stop"'
      - 'New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null'
      - '$logPath = ".\artifacts\woodpecker-release.log"'
      - '"=== ambiente ===" | Set-Content -Path $logPath -Encoding utf8'
      - '$out = @(node --version 2>&1); $out | ForEach-Object { Write-Host $_; Add-Content -Path $logPath -Value ([string]$_) -Encoding utf8 }'
      - '$out = @(npm --version 2>&1); $out | ForEach-Object { Write-Host $_; Add-Content -Path $logPath -Value ([string]$_) -Encoding utf8 }'
      - '$out = @(python --version 2>&1); $out | ForEach-Object { Write-Host $_; Add-Content -Path $logPath -Value ([string]$_) -Encoding utf8 }'
      - '$previous = $ErrorActionPreference; $ErrorActionPreference = "Continue"; $out = @(java -version 2>&1); $javaCode = $LASTEXITCODE; $ErrorActionPreference = $previous; $out | ForEach-Object { Write-Host $_; Add-Content -Path $logPath -Value ([string]$_) -Encoding utf8 }; if ($javaCode -ne 0) { throw "java -version falhou com codigo $javaCode" }'
      - 'if (-not $env:ARTISYS_UTILIDADES_PATH) { throw "ARTISYS_UTILIDADES_PATH ausente no Agent Windows." }'
      - 'if (-not (Test-Path $env:ARTISYS_UTILIDADES_PATH)) { throw "ARTISYS_UTILIDADES_PATH nao encontrado: $env:ARTISYS_UTILIDADES_PATH" }'

  - name: validar-p0-p1
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '$logPath = ".\artifacts\woodpecker-release.log"'
      - '"=== validar-p0-p1 ===" | Add-Content -Path $logPath -Encoding utf8'
      - '$engine = ".\modules\artisys-release\bin\artisys-release.mjs"'
      - 'if (-not (Test-Path $engine)) { throw "artisys-release nao encontrado em $engine" }'
      - '$previous = $ErrorActionPreference; $ErrorActionPreference = "Continue"; & node $engine ".\.artisys\p0-p1-validation.json" --profile quick --report ".\artifacts\artisys-release-report.json" *>&1 | ForEach-Object { Write-Host $_; Add-Content -Path $logPath -Value ([string]$_) -Encoding utf8 }; $code = $LASTEXITCODE; $ErrorActionPreference = $previous; if ($code -ne 0) { throw "P0/P1 falhou com codigo $code." }'

  - name: verificar-relatorio
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '$reportPath = ".\artifacts\artisys-release-report.json"'
      - 'if (-not (Test-Path $reportPath)) { throw "Relatorio P0/P1 nao foi gerado." }'
      - '$report = Get-Content $reportPath -Raw | ConvertFrom-Json'
      - 'if ($report.status -ne "pass") { throw "P0/P1 terminou com status $($report.status), step $($report.failedStep)." }'
      - 'Write-Host "[RepoUteis Woodpecker] P0/P1 aprovado: $reportPath"'

  - name: reportar-falha-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [failure]
    failure: ignore

  - name: reportar-sucesso-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
      ARTISYS_CI_RESULT: 'success'
      ARTISYS_COMMENT_SUCCESS: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [success]
    failure: ignore
