labels:
  platform: windows/amd64
  backend: local

when:
  - event: [push, pull_request, manual]

steps:
  - name: ambiente
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
    commands:
      - '$ErrorActionPreference = "Stop"'
      - 'New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null'
      - '"=== RepoUteis P0/P1 validation ===" | Set-Content -Path ".\artifacts\woodpecker-release.log" -Encoding utf8'
      - 'node --version'
      - 'npm --version'
      - 'python --version'
      - 'java -version'
      - 'if (-not (Test-Path $env:ARTISYS_UTILIDADES_PATH)) { throw "ARTISYS_UTILIDADES_PATH nao encontrado: $env:ARTISYS_UTILIDADES_PATH" }'

  - name: module-dependencies
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "module-dependencies" -Command "npm ci --ignore-scripts --prefix modules\artisys-qa && npm ci --ignore-scripts --prefix modules\artisys-api-contracts && npm install --no-package-lock --prefix modules\artisys-serialport && npm install --no-package-lock --prefix modules\artisys-printing && npm install --no-package-lock --prefix modules\artisys-property-testing && npm install --no-package-lock --prefix modules\artisys-mutation-testing && npm install --no-package-lock --prefix modules\artisys-ai-quality && npm install --no-package-lock --prefix modules\artisys-ai-observability && python -m venv .ci-venv && .ci-venv\Scripts\python.exe -m pip install --upgrade pip && .ci-venv\Scripts\python.exe -m pip install .\modules\artisys-documents[preprocess] && cd modules\artisys-qa && npx.cmd --no-install playwright install chromium"'

  - name: provision-openapi-generator
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "provision-openapi-generator" -Command "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\provision-openapi-generator.ps1"'

  - name: p0-structured-facts
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "p0-structured-facts" -Command "npm test --prefix modules\artisys-structured-facts && npm run check --prefix modules\artisys-structured-facts"'

  - name: p0-property-testing
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "p0-property-testing" -Command "npm test --prefix modules\artisys-property-testing && npm run check --prefix modules\artisys-property-testing"'

  - name: p0-mutation-testing
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "p0-mutation-testing" -Command "npm test --prefix modules\artisys-mutation-testing && npm run check --prefix modules\artisys-mutation-testing"'

  - name: p0-p1-ai-quality
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "p0-p1-ai-quality" -Command "npm test --prefix modules\artisys-ai-quality && npm run check --prefix modules\artisys-ai-quality && npm run example --prefix modules\artisys-ai-quality"'

  - name: p1-ai-observability
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "p1-ai-observability" -Command "npm test --prefix modules\artisys-ai-observability && npm run check --prefix modules\artisys-ai-observability"'

  - name: reusable-contract-smoke
    image: powershell.exe
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "reusable-contract-smoke" -Command "node scripts\reuse-smoke.mjs"'

  - name: full-module-checks
    image: powershell.exe
    environment:
      PACT_DO_NOT_TRACK: 'true'
      OPENAPI_GENERATOR_JAR: '.ci-tools\openapi-generator.jar'
    commands:
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\woodpecker-gate.ps1 -Id "full-module-checks" -Command ".ci-venv\Scripts\python.exe scripts\check-modules.py --browser --pact --generator" -Final'

  - name: reportar-falha-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [failure]
    failure: ignore

  - name: reportar-sucesso-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-release-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-release.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/repoutils-p0-p1-detail'
      ARTISYS_CI_RESULT: 'success'
      ARTISYS_COMMENT_SUCCESS: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'if (-not (Test-Path $reporter)) { throw "artisys-ci-reporter nao encontrado em $reporter" }'
      - 'node $reporter'
    when:
      - event: [push, pull_request, manual]
        status: [success]
    failure: ignore
