labels:
  platform: windows/amd64
  backend: local

when:
  - event: [push, manual]
    branch:
      - main

steps:
  - name: verificar-artisys-qa
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - 'New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null'
      - '$log = ".\artifacts\artisys-qa-verify.log"'
      - '"verificar-artisys-qa" | Set-Content ".\artifacts\artisys-qa-current-step.txt" -Encoding utf8'
      - '$npm = (Get-Command npm.cmd -ErrorAction Stop).Source'
      - '$cmd = (Get-Command cmd.exe -ErrorAction Stop).Source'
      - '$command = (''"{0}" run ci:verify --prefix modules/artisys-qa 2>&1'' -f $npm)'
      - '& $cmd /d /c $command | ForEach-Object { Write-Host $_; Add-Content -Path $log -Value ([string]$_) -Encoding utf8 }'
      - '$code = $LASTEXITCODE'
      - '$status = if ($code -eq 0) { "pass" } else { "fail" }'
      - '$report = @{ schemaVersion = 1; status = $status; failedStep = $(if ($code -eq 0) { $null } else { "artisys-qa:ci-verify" }); steps = @(@{ id = "artisys-qa:ci-verify"; status = $status; exitCode = $code; command = "npm run ci:verify --prefix modules/artisys-qa"; stdout = $null; stderr = $(if ($code -eq 0) { $null } else { "Veja artifacts/artisys-qa-verify.log" }); durationMs = $null }) }'
      - '$report | ConvertTo-Json -Depth 8 | Set-Content ".\artifacts\artisys-qa-verify-report.json" -Encoding utf8'
      - 'if ($code -ne 0) { throw "ArtiSys QA ci:verify falhou com exit $code" }'
      - 'Remove-Item ".\artifacts\artisys-qa-current-step.txt" -ErrorAction SilentlyContinue'

  - name: reportar-sucesso
    image: powershell.exe
    environment:
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-qa-verify-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\artisys-qa-verify.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/artisys-qa'
      ARTISYS_CI_RESULT: 'success'
      ARTISYS_COMMENT_SUCCESS: 'false'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - 'node .\modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs'
    when:
      - event: [push, manual]
        status: [success]
    failure: ignore

  - name: reportar-falha
    image: powershell.exe
    environment:
      ARTISYS_REPORT_PATH: '.\artifacts\artisys-qa-verify-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\artisys-qa-verify.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/artisys-qa'
      ARTISYS_CI_RESULT: 'failure'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$env:ARTISYS_FAILED_STEP = "artisys-qa:ci-verify"'
      - 'node .\modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs'
    when:
      - event: [push, manual]
        status: [failure]
    failure: ignore
