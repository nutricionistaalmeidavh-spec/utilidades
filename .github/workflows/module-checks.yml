name: ArtiSys module checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/**'
      - 'catalog/**'
      - 'scripts/check-modules.py'
      - '.github/workflows/module-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACT_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify ArtiSys hardware module units
        run: |
          node --test modules/artisys-serialport/tests/*.test.js
          node --test modules/artisys-printing/tests/*.test.js
          npm run check --prefix modules/artisys-serialport
          npm run check --prefix modules/artisys-printing
      - name: Install hardware module dependencies
        run: |
          npm install --prefix modules/artisys-serialport
          npm install --prefix modules/artisys-printing
      - name: Smoke test real hardware upstream boundaries
        run: |
          node -e "const s=require('./modules/artisys-serialport'); const m=s.createSerialPortManager(); if(typeof m.list!=='function') process.exit(1);"
          node -e "const p=require('./modules/artisys-printing'); const d=p.createReceiptDocument({title:'ArtiSys smoke'}); const svg=p.renderReceiptSvg(d); if(!String(svg).includes('<svg')) process.exit(1);"
      - name: Install existing module dependencies
        run: |
          npm ci --ignore-scripts --prefix modules/artisys-qa
          npm ci --ignore-scripts --prefix modules/artisys-api-contracts
          python3 -m venv .venv
          .venv/bin/python -m pip install './modules/artisys-documents[preprocess]'
          cd modules/artisys-qa
          npx --no-install playwright install chromium
      - name: Provision pinned generator
        run: |
          curl --fail --location --output "$RUNNER_TEMP/openapi-generator.jar" https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.16.0/openapi-generator-cli-7.16.0.jar
          echo "6999b18cece5b58f5d5b246fef5a43bdf61239491c4f0ed6513214e0f6e8464b  $RUNNER_TEMP/openapi-generator.jar" | sha256sum --check
      - name: Verify modules and external tool boundaries
        env:
          OPENAPI_GENERATOR_JAR: ${{ runner.temp }}/openapi-generator.jar
        run: .venv/bin/python scripts/check-modules.py --browser --pact --generator
