name: ArtiSys module checks (optional runner)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label; self-hosted avoids hosted-minute billing
        default: self-hosted
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      PACT_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies on prepared Node 22+, Python 3.10+, Java 17+ runner
        run: |
          npm ci --ignore-scripts --prefix modules/artisys-qa
          npm ci --ignore-scripts --prefix modules/artisys-api-contracts
          python3 -m venv .venv
          .venv/bin/python -m pip install './modules/artisys-documents[preprocess]'
          cd modules/artisys-qa
          npx --no-install playwright install chromium
      - name: Provision pinned generator
        run: |
          curl --fail --location --output "$RUNNER_TEMP/openapi-generator.jar" https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.16.0/openapi-generator-cli-7.16.0.jar
          echo "6999b18cece5b58f5d5b246fef5a43bdf61239491c4f0ed6513214e0f6e8464b  $RUNNER_TEMP/openapi-generator.jar" | sha256sum --check
      - name: Verify modules and real external tool boundaries
        env:
          OPENAPI_GENERATOR_JAR: ${{ runner.temp }}/openapi-generator.jar
        run: .venv/bin/python scripts/check-modules.py --browser --pact --generator
