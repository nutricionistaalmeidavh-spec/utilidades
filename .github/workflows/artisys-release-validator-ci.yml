name: ArtiSys release validator
on:
  pull_request:
    paths:
      - 'modules/artisys-release-validator/**'
      - '.github/workflows/artisys-release-validator-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d9d1ac5e94b82a2892d646b6c19
        with:
          node-version: '22'
      - name: Run contract tests
        run: npm test --prefix modules/artisys-release-validator
